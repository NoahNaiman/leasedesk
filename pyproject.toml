[project]
name = "leasedesk"
version = "0.1.0"
description = "Lease abstraction and portfolio tools for retail property management"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# UP042: str-mixin enums are kept deliberately (StrEnum changes how values format).
# B905: zip() is used on purpose to pair neighbouring items of one list.
ignore = ["UP042", "B905"]
