name: benchmark (paid API, manual)

# Runs the extraction benchmark against the real Anthropic API (about $2.50 per run).
# Start it from the Actions tab. Needs an ANTHROPIC_API_KEY repository secret.
# The receipt it writes is uploaded as an artifact; commit it with the change it covers.
on:
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run benchmark
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/evaluate_extraction.py --set all
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            benchmark/receipt.json
            benchmark_results/
